version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: country_made_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jeans}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jeans}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: country_made_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-jeans}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8501:8501"
    volumes:
      - uploads_data:/app/uploads
      - ./assets:/app/assets:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
